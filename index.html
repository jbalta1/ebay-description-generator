<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>British Classic Car Parts - eBay Description Generator</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            align-items: start;
        }

        .panel {
            background: white;
            border-radius: 12px;
            padding: 30px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
        }

        h1 {
            color: #1e3c72;
            margin-bottom: 10px;
            font-size: 28px;
        }

        .subtitle {
            color: #666;
            margin-bottom: 25px;
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
            color: #333;
            font-size: 14px;
        }

        input, select, textarea {
            width: 100%;
            padding: 10px 12px;
            border: 2px solid #e0e0e0;
            border-radius: 6px;
            font-size: 14px;
            font-family: inherit;
            transition: border-color 0.3s;
        }

        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: #2a5298;
        }

        textarea {
            resize: vertical;
            min-height: 80px;
        }

        .row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        button {
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            color: white;
            border: none;
            padding: 14px 28px;
            border-radius: 6px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(30, 60, 114, 0.4);
        }

        button:active {
            transform: translateY(0);
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .output {
            background: #f8f9fa;
            border: 2px solid #e0e0e0;
            border-radius: 6px;
            padding: 20px;
            min-height: 400px;
            font-size: 14px;
            line-height: 1.6;
            position: relative;
        }

        .output.empty {
            display: flex;
            align-items: center;
            justify-content: center;
            color: #999;
            font-style: italic;
        }

        .copy-btn {
            position: absolute;
            top: 15px;
            right: 15px;
            background: #28a745;
            padding: 8px 16px;
            font-size: 13px;
            width: auto;
        }

        .copy-btn:hover {
            background: #218838;
        }

        .loading {
            text-align: center;
            color: #666;
            padding: 40px;
        }

        .spinner {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #2a5298;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 15px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .output h2 {
            color: #1e3c72;
            margin-top: 20px;
            margin-bottom: 10px;
            font-size: 18px;
        }

        .output h2:first-child {
            margin-top: 0;
        }

        .output ul {
            margin-left: 20px;
            margin-bottom: 15px;
        }

        .output li {
            margin-bottom: 5px;
        }

        @media (max-width: 968px) {
            .container {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="panel">
            <h1>🇬🇧 British Classic Car Parts</h1>
            <p class="subtitle">eBay Description Generator</p>

            <div id="partForm">
                <div class="form-group">
                    <label for="partName">Part Name *</label>
                    <input type="text" id="partName" placeholder="e.g., Lucas Fog Lamp, SU Carburetor, Door Handle" required>
                </div>

                <div class="row">
                    <div class="form-group">
                        <label for="manufacturer">Manufacturer</label>
                        <input type="text" id="manufacturer" placeholder="e.g., Lucas, SU, Smiths">
                    </div>
                    <div class="form-group">
                        <label for="partNumber">Part Number</label>
                        <input type="text" id="partNumber" placeholder="e.g., 54575894">
                    </div>
                </div>

                <div class="form-group">
                    <label for="fitment">Fits Models *</label>
                    <input type="text" id="fitment" placeholder="e.g., MGB 1962-1980, Triumph TR6, Austin Healey 3000" required>
                </div>

                <div class="row">
                    <div class="form-group">
                        <label for="condition">Condition *</label>
                        <select id="condition" required>
                            <option value="">Select...</option>
                            <option value="new">New Old Stock (NOS)</option>
                            <option value="excellent">Excellent Used</option>
                            <option value="good">Good Used</option>
                            <option value="fair">Fair - Needs Restoration</option>
                            <option value="parts">For Parts/Repair</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="era">Era</label>
                        <input type="text" id="era" placeholder="e.g., 1960s, 1970s">
                    </div>
                </div>

                <div class="form-group">
                    <label for="details">Additional Details</label>
                    <textarea id="details" placeholder="Any specific features, markings, provenance, or condition notes..."></textarea>
                </div>

                <div class="row">
                    <div class="form-group">
                        <label for="shipping">Shipping</label>
                        <input type="text" id="shipping" placeholder="e.g., UK mainland, Worldwide available">
                    </div>
                    <div class="form-group">
                        <label for="returns">Returns</label>
                        <select id="returns">
                            <option value="30">30 day returns accepted</option>
                            <option value="14">14 day returns accepted</option>
                            <option value="none">No returns (parts/repair)</option>
                        </select>
                    </div>
                </div>

                <button type="button" id="generateBtn">Generate eBay Description</button>
            </div>
        </div>

        <div class="panel">
            <h1>📝 Generated Description</h1>
            <p class="subtitle">Ready to copy & paste into eBay</p>
            
            <div id="output" class="output empty">
                Fill in the form and click "Generate" to create your eBay listing description
            </div>
        </div>
    </div>

    <script>
        const output = document.getElementById('output');
        const generateBtn = document.getElementById('generateBtn');

        generateBtn.addEventListener('click', async () => {
            const formData = {
                partName: document.getElementById('partName').value,
                manufacturer: document.getElementById('manufacturer').value,
                partNumber: document.getElementById('partNumber').value,
                fitment: document.getElementById('fitment').value,
                condition: document.getElementById('condition').value,
                era: document.getElementById('era').value,
                details: document.getElementById('details').value,
                shipping: document.getElementById('shipping').value,
                returns: document.getElementById('returns').value
            };

            // Validate required fields
            if (!formData.partName || !formData.fitment || !formData.condition) {
                alert('Please fill in all required fields (Part Name, Fits Models, and Condition)');
                return;
            }

            // Show loading state
            output.classList.remove('empty');
            output.innerHTML = '<div class="loading"><div class="spinner"></div><p>Crafting your eBay description...</p></div>';
            generateBtn.disabled = true;

            try {
                const description = await generateDescription(formData);
                displayDescription(description);
            } catch (error) {
                output.innerHTML = `<p style="color: red;">Error generating description: ${error.message}</p>`;
            } finally {
                generateBtn.disabled = false;
            }
        });

        async function generateDescription(data) {
            // Simulate brief processing time
            await new Promise(resolve => setTimeout(resolve, 800));
            
            const conditionDescriptions = {
                'new': 'New Old Stock (NOS) - genuine unused original part',
                'excellent': 'Excellent used condition with minimal wear',
                'good': 'Good used condition with some age-appropriate wear',
                'fair': 'Fair condition - ideal for restoration or recommissioning',
                'parts': 'For parts or repair - sold as-is'
            };

            const conditionDetails = {
                'new': 'This is genuine New Old Stock - an original part that has never been fitted or used. A rare find for the serious restorer or enthusiast looking for authenticity.',
                'excellent': 'This part shows minimal signs of use and has been well maintained. Functions perfectly and presents beautifully.',
                'good': 'Showing honest age-appropriate wear consistent with a classic British car part. Fully functional and ready to fit.',
                'fair': 'This part requires recommissioning or restoration work. An excellent opportunity for a restoration project.',
                'parts': 'Being sold as-is for parts or repair. May have damage or missing components - please review photos carefully.'
            };

            let description = `<h2>🏁 ${data.partName}</h2>`;
            
            // Opening paragraph
            description += `<p>Offered for sale is ${data.manufacturer ? 'a genuine <strong>' + data.manufacturer + '</strong>' : 'an original'} ${data.partName}`;
            if (data.partNumber) {
                description += ` (Part No. ${data.partNumber})`;
            }
            description += ` suitable for ${data.fitment}. `;
            description += `${conditionDetails[data.condition] || ''}</p>`;

            // Key Features
            description += `<h2>✨ Key Features</h2><ul>`;
            if (data.manufacturer) {
                description += `<li><strong>Manufacturer:</strong> ${data.manufacturer} - renowned British automotive heritage</li>`;
            }
            if (data.partNumber) {
                description += `<li><strong>Part Number:</strong> ${data.partNumber}</li>`;
            }
            if (data.era) {
                description += `<li><strong>Era:</strong> ${data.era} - authentic period specification</li>`;
            }
            description += `<li><strong>Fitment:</strong> ${data.fitment}</li>`;
            description += `<li><strong>Condition:</strong> ${conditionDescriptions[data.condition]}</li>`;
            description += `</ul>`;

            // Condition Details
            description += `<h2>🔍 Condition</h2>`;
            description += `<p>${conditionDetails[data.condition]}`;
            if (data.details) {
                description += ` ${data.details}`;
            }
            description += `</p>`;
            description += `<p><em>Please review all photographs carefully as they form part of the description. Item sold as described and photographed.</em></p>`;

            // Fitment
            description += `<h2>🔧 Fitment Information</h2>`;
            description += `<p>This part is confirmed to fit: <strong>${data.fitment}</strong></p>`;
            description += `<p>Please verify fitment for your specific vehicle before purchasing. Happy to answer any technical questions - we're passionate about classic British cars!</p>`;

            // Why Buy
            description += `<h2>🇬🇧 Why Buy From Us</h2><ul>`;
            description += `<li>Specialist knowledge of classic British marques</li>`;
            description += `<li>Honest, detailed descriptions and photographs</li>`;
            description += `<li>Carefully packaged for safe delivery</li>`;
            description += `<li>Fast dispatch</li>`;
            description += `</ul>`;

            // Shipping and Returns
            description += `<h2>📦 Shipping & Returns</h2>`;
            if (data.shipping) {
                description += `<p><strong>Shipping:</strong> ${data.shipping}</p>`;
            } else {
                description += `<p><strong>Shipping:</strong> UK mainland - International shipping available on request</p>`;
            }
            
            if (data.returns === '30') {
                description += `<p><strong>Returns:</strong> 30-day money back guarantee. Buy with confidence!</p>`;
            } else if (data.returns === '14') {
                description += `<p><strong>Returns:</strong> 14-day returns accepted</p>`;
            } else {
                description += `<p><strong>Returns:</strong> Sold as-is, no returns accepted (parts/repair item)</p>`;
            }

            description += `<hr style="margin: 20px 0; border: none; border-top: 1px solid #ddd;">`;
            description += `<p><em>Keep your classic British car on the road with genuine period parts. Any questions? Please don't hesitate to ask!</em></p>`;

            return description;
        }

        function displayDescription(html) {
            output.innerHTML = html + '<button class="copy-btn" onclick="copyToClipboard()">📋 Copy Description</button>';
        }

        function copyToClipboard() {
            // Get HTML content without the button
            const tempDiv = document.createElement('div');
            tempDiv.innerHTML = output.innerHTML;
            const button = tempDiv.querySelector('.copy-btn');
            if (button) button.remove();
            
            const htmlContent = tempDiv.innerHTML;
            const textContent = tempDiv.innerText;
            
            // Create a rich text blob with HTML
            const blob = new Blob([htmlContent], { type: 'text/html' });
            const blobText = new Blob([textContent], { type: 'text/plain' });
            
            const clipboardItem = new ClipboardItem({
                'text/html': blob,
                'text/plain': blobText
            });
            
            // Try modern clipboard API first
            if (navigator.clipboard && navigator.clipboard.write) {
                navigator.clipboard.write([clipboardItem]).then(() => {
                    const btn = output.querySelector('.copy-btn');
                    const originalText = btn.textContent;
                    btn.textContent = '✅ Copiat!';
                    setTimeout(() => {
                        btn.textContent = originalText;
                    }, 2000);
                }).catch(() => {
                    // Fallback to execCommand
                    fallbackCopy(htmlContent, textContent);
                });
            } else {
                fallbackCopy(htmlContent, textContent);
            }
        }
        
        function fallbackCopy(html, text) {
            // Create a temporary container with the HTML
            const container = document.createElement('div');
            container.innerHTML = html;
            container.style.position = 'fixed';
            container.style.opacity = '0';
            container.style.pointerEvents = 'none';
            document.body.appendChild(container);
            
            // Select the content
            const range = document.createRange();
            range.selectNodeContents(container);
            const selection = window.getSelection();
            selection.removeAllRanges();
            selection.addRange(range);
            
            try {
                document.execCommand('copy');
                const btn = output.querySelector('.copy-btn');
                const originalText = btn.textContent;
                btn.textContent = '✅ Copiat!';
                setTimeout(() => {
                    btn.textContent = originalText;
                }, 2000);
            } catch (err) {
                alert('Si us plau, selecciona i copia el text manualment');
            } finally {
                document.body.removeChild(container);
                selection.removeAllRanges();
            }
        }
    </script>
</body>
</html>
